name: Site
on:
  push:
    branches: [main]
  pull_request:
  # refreshes the plugin repo stats on the plugins page
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_VERSION: 26
jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # the checkout is shallow, and the site builds parts of itself from the pinned commits
      - run: git fetch --depth=1 origin $(node -p "Object.values(require('./build/site.json').refs).join(' ')")

      # plugin stats are fetched in full once a week, falling back to the latest ones if that fails; builds in between
      # only fetch the repos of new plugins
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - id: restore-stats
        uses: actions/cache/restore@v6
        with:
          path: build/plugin-stats.json
          key: plugin-stats-${{ steps.week.outputs.week }}
          restore-keys: plugin-stats-

      - id: fetch-stats
        continue-on-error: true
        run: node build/plugin-stats.js ${{ steps.restore-stats.outputs.cache-hit != 'true' && '--refresh' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - if: steps.restore-stats.outputs.cache-hit != 'true' && steps.fetch-stats.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: build/plugin-stats.json
          key: plugin-stats-${{ steps.week.outputs.week }}

      - run: npm run site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-site:
    if: github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
