name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
env:
  NODE_VERSION: 24
  PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # the checkout is shallow, and the site builds parts of itself from the pinned commits
      - run: git fetch --depth=1 origin $(node -p "Object.values(require('./build/site.json').refs).join(' ')")

      - run: npm run site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-site:
    if: github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      size: ${{ steps.size.outputs.summary }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - run: node ./spec/ssr/ssr_node.js
      - run: node ./spec/tree_shaking.js
      - run: node ./spec/dist.js

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno run ./spec/ssr/ssr_deno.js

      # keep the head build, sources and script out of git's way so they survive the base checkout; the script
      # stays in the repo root to resolve rolldown from node_modules
      - run: mkdir head && mv dist head/ && cp -r src package.json head/ && cp build/size.js size.js

      - name: Build base
        if: env.BASE_SHA && !startsWith(env.BASE_SHA, '0000000')
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git checkout "$BASE_SHA" && npm ci && npm run build

      - id: size
        run: node size.js . head >> "$GITHUB_OUTPUT"

  size-report:
    needs: check
    if: always() && needs.check.outputs.size
    name: 'size: ${{ needs.check.outputs.size }}'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: 'true'

  # separate jobs rather than a matrix so that they show up flat in the run summary
  test-chromium:
    name: test (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_BROWSER: chromium
    steps: &test-steps
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install "$TEST_BROWSER"

      - if: env.TEST_DIST
        run: npm run build

      - run: npm test

  # also tests the minified bundle instead of the sources, to catch what the build breaks
  test-firefox:
    name: test (firefox, dist)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_BROWSER: firefox
      TEST_DIST: '1'
    steps: *test-steps

  test-webkit:
    name: test (webkit)
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      TEST_BROWSER: webkit
    steps: *test-steps

  publish-artifacts:
    permissions:
      contents: write
    if: github.repository_owner == 'Leaflet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: dev-snapshot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run zip

      - name: Publish development snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev > /dev/null 2>&1 ||
            gh release create dev --prerelease --title "Development snapshot" --target "$GITHUB_SHA" --notes ""
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          gh release edit dev --notes "Latest build of \`main\` at $GITHUB_SHA ($(date -u +'%Y-%m-%d %H:%M UTC')), updated automatically on every push. Not a stable release."
          gh release upload dev dist/* --clobber
          # drop assets the build no longer produces
          for name in $(gh release view dev --json assets -q '.assets[].name'); do
            [ -e "dist/$name" ] || gh release delete-asset dev "$name" --yes
          done

  publish-npm:
    if: github.repository_owner == 'Leaflet' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Publish to NPM
        run: |
          TAG=$(echo $GITHUB_REF_NAME | grep -oP '^v\d+\.\d+\.\d+-?\K(\w+)?')
          npm publish --tag ${TAG:-latest}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
