version: 2
updates:
  - package-ecosystem: npm
    directory: /
    rebase-strategy: disabled
    versioning-strategy: increase
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: disabled
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
