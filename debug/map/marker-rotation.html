<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Leaflet debug page - Marker rotation</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0" />
		<link rel="stylesheet" href="../../src/leaflet.css" />
		<link rel="stylesheet" href="../css/screen.css" />
		<script type="importmap">
			{
				"imports": {
					"leaflet": "../../src/Leaflet.js"
				}
			}
		</script>
		<style>
			.arrow {
				background: #e33;
				clip-path: polygon(50% 0, 100% 100%, 50% 75%, 0 100%);
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script type="module">
			import {DivIcon, LeafletMap, Marker, TileLayer} from 'leaflet';

			const map = new LeafletMap('map', {center: [0, 0], zoom: 3});

			new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

			// default icon, spinning around its tip
			const spinning = new Marker([0, -20], {title: 'Spinning'}).addTo(map).bindPopup('Spinning');
			let angle = 0;
			setInterval(() => spinning.setRotation(angle = (angle + 3) % 360), 50);

			// draggable: the rotation should hold during the drag
			new Marker([0, 0], {draggable: true, autoPan: true, rotation: 45, title: 'Draggable'})
				.addTo(map).bindPopup('Draggable, 45°');

			// a DivIcon with a centered anchor, rotated by heading, like a vehicle
			const arrow = new Marker([0, 20], {
				icon: new DivIcon({className: 'arrow', iconSize: [20, 24]}),
				rotation: 120,
				draggable: true,
				title: 'Arrow'
			}).addTo(map).bindPopup('DivIcon, 120°');
			arrow.on('click', () => {
				const rotation = (arrow.getRotation() + 30) % 360;
				arrow.setRotation(rotation).setPopupContent(`DivIcon, ${rotation}°`);
			});
		</script>
	</body>
</html>
