{%- assign major = site.latest_leaflet_version | split: "." | first -%}
{%- if major == "1" %}
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@{{ site.latest_leaflet_version}}/dist/leaflet.css" integrity="{{site.integrity_hash_css}}" crossorigin=""/>
	<script src="https://cdn.jsdelivr.net/npm/leaflet@{{ site.latest_leaflet_version}}/dist/leaflet.js" integrity="{{site.integrity_hash_uglified}}" crossorigin=""></script>
{%- elsif site.preview %}
	<link rel="stylesheet" href="/preview/leaflet.css"/>
	<script type="importmap">{"imports": {"leaflet": "/preview/Leaflet.js"}}</script>
{%- else %}
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@{{ site.latest_leaflet_version}}/dist/leaflet.css" integrity="{{site.integrity_hash_css}}" crossorigin=""/>
	<script type="importmap">
		{
			"imports": {
				"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@{{ site.latest_leaflet_version}}/dist/leaflet.js"
			},
			"integrity": {
				"https://cdn.jsdelivr.net/npm/leaflet@{{ site.latest_leaflet_version}}/dist/leaflet.js": "{{site.integrity_hash_uglified}}"
			}
		}
	</script>
{%- endif %}
