{%- assign width = include.width -%}
{%- assign major = site.latest_leaflet_version | split: "." | first -%}
{%- if major == "1" and width == nil %}{% assign width = 600 %}{% endif -%}
<figure class="example-frame">
<iframe src='{{ include.url }}' title='Example map'
	style='height: {% if include.height %}{{ include.height }}{% else %}400{% endif %}px;{% if width %} max-width: {{ width }}px;{% endif %}'></iframe>
<figcaption><a href='{{ include.url }}'>See this example stand-alone.</a></figcaption>
</figure>
