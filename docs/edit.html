<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Leaflet edit</title>
	</head>
	<body>
		<script>

			const config = {
				provider: 'plunker',
				title: 'Leaflet',
				description: 'Leaflet example',
				version: '{{ site.latest_leaflet_version }}',
				html: '<div id="map"></div>',
				css: 'body {\n\tmargin: 0;\n}\nhtml, body, #map {\n\theight: 100%;\n}',
				js: "import {LeafletMap, TileLayer, Marker} from 'leaflet';\n\nconst map = new LeafletMap('map', {\n\tcenter: [0, 0],\n\tzoom: 0\n});\n\nnew TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {\n\tmaxZoom: 19,\n\tattribution: '&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a>'\n}).addTo(map);\n\nnew Marker(map.getCenter()).addTo(map);"
			};

			const hash = location.hash.substring(1);

			if (hash) {
				hash.split(';').forEach((str) => {
					const arg = str.split(':');
					config[arg[0]] = arg[1];
				});
			}

			const cssFile = config.cssFile ?? `https://cdn.jsdelivr.net/npm/leaflet@${config.version}/dist/leaflet.css`;
			const jsFile = config.jsFile ?? `https://cdn.jsdelivr.net/npm/leaflet@${config.version}/dist/leaflet.js`;

			// Leaflet 2 is an ES module, so every editor gets the import map in its HTML and runs the code as a module
			const importMap = `<script type="importmap">\n{\n\t"imports": {\n\t\t"leaflet": "${jsFile}"\n\t}\n}\n<\/script>`;
			const html = `${importMap}\n${config.html}`;

			function createForm(action) {
				const form = document.createElement('form');
				form.setAttribute('method', 'post');
				form.setAttribute('action', action);
				form.createInput = function (name, value) {
					const input = document.createElement('input');
					input.setAttribute('type', 'hidden');
					input.setAttribute('name', name);
					input.setAttribute('value', value);
					this.appendChild(input);
				};
				document.body.appendChild(form);
				return form;
			}

			let form;

			if (config.provider === 'plunker') {
				form = createForm('https://plnkr.co/edit/?p=preview');
				form.createInput('description', config.description);
				form.createInput('files[index.html]', `<!DOCTYPE html>\n<html>\n<head>\n\t<title>Leaflet</title>\n\t<meta charset="utf-8" />\n\t<meta name="viewport" content="width=device-width, initial-scale=1.0" />\n\t<link rel="stylesheet" href="${cssFile}" />\n\t<link rel="stylesheet" href="style.css" />\n</head>\n<body>\n${html}\n<script type="module" src="script.js"><\/script>\n</body>\n</html>`);
				form.createInput('files[style.css]', config.css);
				form.createInput('files[script.js]', config.js);
				form.createInput('tags[0]', 'leaflet');
				form.createInput('tags[1]', 'map');
				form.createInput('tags[2]', 'gis');
				form.createInput('private', false);
			}

			if (config.provider === 'codepen') {
				form = createForm('https://codepen.io/pen/define');
				form.createInput('data', JSON.stringify({
					title: config.title,
					description: config.description,
					private: false,
					tags: ['leaflet', 'map', 'gis'],
					editors: '001',
					layout: 'top',
					head: '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
					html,
					css: config.css,
					css_external: cssFile,
					js: config.js
				}));
			}

			if (config.provider === 'jsfiddle') {
				form = createForm('https://jsfiddle.net/api/post/library/pure/');
				form.createInput('title', config.title);
				form.createInput('description', config.description);
				form.createInput('resources', cssFile);
				form.createInput('html', html);
				form.createInput('css', config.css);
				form.createInput('js', config.js);
				form.createInput('panel_html', 0);
				form.createInput('panel_css', 0);
				form.createInput('panel_js', 0);
				form.createInput('dtd', 'html');
				form.createInput('normalize_css', 'no');
				form.createInput('wrap', 'b');
			}

			if (form instanceof HTMLFormElement) {
				form.submit();
			}

		</script>
	</body>
</html>
